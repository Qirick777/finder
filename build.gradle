plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

// Forge 1.20.1 은 Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ★ 소스에 한글 문자열이 있으므로 빌드 머신 로케일(예: 한국어 Windows=MS949)과 무관하게
//   UTF-8 로 컴파일해야 인게임 채팅/CLI 한글이 안 깨진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 콘솔 로그도 UTF-8 로 (한글 로그 깨짐 방지). 채팅은 컴파일 인코딩으로 이미 해결됨.
            jvmArgs '-Dfile.encoding=UTF-8'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // 스크린샷 촬영용 자동 접속 — -PquickJoin=<주소:포트> 를 줄 때만 붙는다.
            // 평소 개발 실행에는 아무 영향이 없다.
            if (project.hasProperty('quickJoin')) {
                args '--quickPlayMultiplayer', project.property('quickJoin')
            }
            if (project.hasProperty('winW')) {
                args '--width', project.property('winW'), '--height', project.property('winH')
            }
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle 이 Minecraft/Forge 를 주입. 추가 의존성 생기면 여기에.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// ── 헤드리스 순수 로직 검증 (설계서 §17) ─────────────────────────────
// Minecraft 클라이언트 없이 /evotest 를 CLI 로 실행.
//   ./gradlew evotest --args="genetics"   ./gradlew evotest --args="all"
// (com.evosim.core / com.evosim.test 는 마크 의존성이 없어 순수 실행 가능.)
tasks.register('evotest', JavaExec) {
    group = 'verification'
    description = 'Run headless /evotest (pure core, no Minecraft render)'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.evosim.test.EvoTest'
    args 'all'   // 기본값. CLI 의 --args="genetics" 가 이를 덮어씀.
    // stdout 인코딩 — EvoTest 가 System.out 을 UTF-8 로 감싸도, 그 아래 스트림이 ASCII 면
    // 한글이 '?' 로 뭉개져 실패 사유를 읽을 수 없다. JVM 기본 인코딩부터 UTF-8 로 박는다.
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "$buildDir/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
tasks.named('processResources').configure { dependsOn generateModMetadata }

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// evotest 의 런타임 클래스패스를 파일로 뽑는다 — CLI 에서 java 를 직접 띄워야
// Gradle 로거의 재인코딩(한글 '?' 뭉갬)을 건너뛸 수 있다.
tasks.register('evotestCp') {
    dependsOn tasks.named('classes')
    doLast {
        file("$buildDir/evotest.cp").text = sourceSets.main.runtimeClasspath.asPath
    }
}
